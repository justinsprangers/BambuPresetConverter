<!doctype html>
<meta charset="utf-8"><title>Converter tests</title>
<pre id="r">running...</pre>
<script src="../profiles.js"></script>
<script src="../converter.js"></script>
<script src="fixtures.js"></script>
<script>
(async () => {
  const PC = window.PresetConverter, F = window.FIXTURES, log = [];
  const t = (n, c, extra) => log.push((c ? 'PASS ' : 'FAIL ') + n + (c || extra === undefined ? '' : '  -> ' + JSON.stringify(extra)));
  const src = n => PC.fromUserJson(F.presets[n], n).preset;
  const X2D = 'Bambu Lab X2D', A1 = 'Bambu Lab A1', A1M = 'Bambu Lab A1 mini', H2D = 'Bambu Lab H2D', P1S = 'Bambu Lab P1S';
  const ok = rs => rs.filter(r => !r.skip);
  const fromProj = cfg => PC.fromProject(cfg, 'x.3mf').filter(x => x.preset).map(x => x.preset);

  // ---- filament: user .json ----
  let r = ok(PC.convertPreset(src('TPU Fast @BBL X2D 0.4 nozzle'), A1));
  let j = r[0] && r[0].json;
  t('X2D->A1 one copy', r.length === 1, r);
  t('X2D->A1 base', j.inherits === 'Generic TPU @BBL A1', j.inherits);
  t('X2D->A1 locked to 0.4', JSON.stringify(j.compatible_printers) === '["Bambu Lab A1 0.4 nozzle"]', j.compatible_printers);
  t('X2D->A1 Direct Drive values', j.nozzle_temperature[0] === '237' && j.filament_max_volumetric_speed[0] === '5' && j.nozzle_temperature.length === 1, j.nozzle_temperature);
  t('X2D->A1 plain values copied', j.fan_max_speed[0] === '90');
  t('X2D->A1 name', j.name === 'TPU Fast @BBL A1' && j.filament_settings_id[0] === j.name, j.name);

  r = ok(PC.convertPreset(src('TPU Fast @BBL X2D 0.4 nozzle'), P1S));
  t('X2D->P1S base Generic TPU', r[0] && r[0].json.inherits === 'Generic TPU', r);
  t('X2D->P1S locked to P1S 0.4', r[0] && JSON.stringify(r[0].json.compatible_printers) === '["Bambu Lab P1S 0.4 nozzle"]');

  r = ok(PC.convertPreset(src('TPU Fast @BBL X2D 0.4 nozzle'), H2D));
  j = r[0] && r[0].json;
  t('X2D->H2D variant arrays match H2D', j && j.nozzle_temperature.length === j.filament_extruder_variant.length && j.nozzle_temperature[0] === '237', j);

  r = ok(PC.convertPreset(src('Strong and Slow TPU @BBL A1'), X2D));
  t('A1->X2D two copies', r.length === 2, r.map(x => x.json.inherits));
  const b04 = r.find(x => x.nozzles.join() === '0.4'), b68 = r.find(x => x.nozzles.join() === '0.6,0.8');
  t('A1->X2D 0.4 base', b04 && b04.json.inherits === 'Generic TPU @BBL X2D 0.4 nozzle');
  t('A1->X2D 0.6/0.8 base', b68 && b68.json.inherits === 'Generic TPU @BBL X2D');
  t('A1->X2D DD Standard only', b04 && JSON.stringify(b04.json.nozzle_temperature) === '["220","nil","nil","nil"]', b04 && b04.json.nozzle_temperature);

  // ---- .3mf: filaments ----
  const proj = fromProj(F.project), fil = proj.filter(p => p.kind === 'filament');
  t('3mf: two filaments + one process', fil.length === 2 && proj.filter(p => p.kind === 'process').length === 1, proj.map(p => p.kind + ':' + p.name));
  t('3mf: per-filament variant values', fil[0].values.filament_max_volumetric_speed.join() === '5,3.2,3.2,3.2', fil[0].values.filament_max_volumetric_speed);
  t('3mf: second filament values', fil[1].values.filament_max_volumetric_speed[0] === '2.7');
  r = ok(PC.convertPreset(fil[1], A1));
  t('3mf filament->A1', r[0] && r[0].json.filament_max_volumetric_speed[0] === '2.7' && r[0].json.inherits === 'Generic TPU @BBL A1', r);
  r = ok(PC.convertPreset(fil[0], H2D));
  t('3mf filament->H2D: unedited X2D defaults become nil', r[0] && JSON.stringify(r[0].json.filament_max_volumetric_speed) === JSON.stringify(['5', ...Array(r[0].json.filament_extruder_variant.length - 1).fill('nil')]), r[0] && r[0].json.filament_max_volumetric_speed);

  // ---- .3mf: process ----
  const proc = proj.find(p => p.kind === 'process');
  t('3mf process read', proc.name === '0.20mm TPU Fast @BBL X2D' && proc.inherits === '0.20mm Standard @BBL X2D', proc);
  r = ok(PC.convertPreset(proc, A1M));
  j = r[0] && r[0].json;
  t('process X2D->A1M base', j && j.inherits === '0.20mm Standard @BBL A1M', j && j.inherits);
  t('process X2D->A1M name + id', j && j.name === '0.20mm TPU Fast @BBL A1M' && j.print_settings_id === j.name, j && j.name);
  t('process X2D->A1M DD speed', j && JSON.stringify(j.outer_wall_speed) === '["80"]', j && j.outer_wall_speed);
  t('process X2D->A1M scalars kept', j && j.line_width === '0.44' && j.wall_loops === '3' && j.sparse_infill_pattern === 'adaptivecubic');
  t('process X2D->A1M no lock needed', j && !j.compatible_printers, j && j.compatible_printers);
  r = ok(PC.convertPreset(proc, P1S));
  t('process X2D->P1S base + lock + name', r[0] && r[0].json.inherits === '0.20mm Standard @BBL X1C' && r[0].json.name === '0.20mm TPU Fast @BBL P1S' &&JSON.stringify(r[0].json.compatible_printers) === '["Bambu Lab P1S 0.4 nozzle"]', r[0] && r[0].json);
  r = ok(PC.convertPreset(proc, H2D));
  j = r[0] && r[0].json;
  // H2D has Direct Drive Standard on both extruders; both get the edited value.
  t('process X2D->H2D only DD Standard set', j && j.print_extruder_variant.every((v, i) => j.outer_wall_speed[i] === (v === 'Direct Drive Standard' ? '80' : 'nil')), j && j.outer_wall_speed);
  const slowProc = fromProj(F.projectSlow).find(p => p.kind === 'process');
  r = ok(PC.convertPreset(slowProc, A1));
  t('slow process->A1 travel speed', r[0] && JSON.stringify(r[0].json.travel_speed) === '["400"]' && r[0].json.support_angle === '22.5', r[0] && r[0].json.travel_speed);

  // ---- process: saved user .json ----
  const up = src('0.20mm TPU Fast @BBL X2D');
  t('user process json detected', up.kind === 'process', up.kind);
  r = ok(PC.convertPreset(up, A1M));
  j = r[0] && r[0].json;
  t('user process->A1M', j && j.inherits === '0.20mm Standard @BBL A1M' && JSON.stringify(j.support_speed) === '["80"]' && j.print_settings_id === j.name, j);
  t('user process->A1M drops X2D extruder ids', j && !('print_extruder_id' in j));
  t('non-Bambu and printer presets skipped', !!PC.fromUserJson({ name: 'x', inherits: '0.20mm Standard @Creality CR10V2' }).skip &&
    !!PC.fromUserJson({ name: 'y', inherits: 'fdm', printer_settings_id: 'y' }).skip);

  // ---- convertAll naming / paths ----
  const all = PC.convertAll([proc, ...fil], [A1M]);
  t('convertAll kinds', all.files.some(f => f.kind === 'process') && all.files.filter(f => f.kind === 'filament').length === 2, all.files.map(f => f.kind + ':' + f.name));
  const parsed = all.files.map(f => JSON.parse(new TextDecoder().decode(f.data)));
  t('version has no leading zeros', parsed.every(p => /^\d+(\.\d+)*$/.test(p.version) && !/(^|\.)0\d/.test(p.version)), parsed.map(p => p.version));

  // preview
  const ch = all.rows.find(r => r.kind === 'process').changes;
  const ow = ch.find(c => c.key === 'outer_wall_speed');
  t('preview: per-extruder source shows only edits', ow && ow.before === 'DD Std 80, others default' && ow.after === '80' && !ow.dropped, ow);
  t('preview: nothing dropped X2D->A1M', ch.every(c => !c.dropped), ch.filter(c => c.dropped));

  // bundle output
  const fb = PC.makeBundle(all.files.filter(f => f.kind === 'filament'));
  const fbEntries = await PC.readZip(await fb.blob.arrayBuffer(), () => true);
  const structure = JSON.parse(new TextDecoder().decode(fbEntries.find(e => e.path === 'bundle_structure.json').data));
  t('bundle: .bbsflmt for filaments only', fb.fileName.endsWith('.bbsflmt'), fb.fileName);
  t('bundle: structure matches Bambu export', structure.bundle_type === 'filament config bundle' && structure.filament_vendor[0].vendor === 'Generic' &&
    structure.filament_vendor[0].filament_path.every(p => fbEntries.some(e => e.path === p)), structure);
  const mixed = PC.makeBundle(all.files);
  t('bundle: mixed kinds -> .zip with all files', mixed.fileName.endsWith('.zip') && (await PC.readZip(await mixed.blob.arrayBuffer(), () => true)).length === all.files.length + 1, mixed.fileName);

  // folder input: Bambu .info files ignored, duplicates collapsed
  const enc = new TextEncoder(), fj = enc.encode(JSON.stringify(F.presets['TPU Fast']));
  const fromFolder = await PC.readInputs([{ name: 'user/1/filament/TPU Fast.json', data: fj }, { name: 'user/1/filament/TPU Fast.info', data: enc.encode('x') },
    { name: 'user/2/filament/TPU Fast.json', data: fj }]);
  t('folder input: dedupe + ignore .info', fromFolder.length === 1 && fromFolder[0].preset, fromFolder);

  // ---- brute force: every source to every printer; no copy may apply to a nozzle the source lacked ----
  const sources = [...Object.keys(F.presets).map(src), ...proj, ...fromProj(F.projectSlow)];
  let bad = [], count = 0;
  const db = PC.db();
  for (const s of sources) {
    const base = db.byName[s.kind].get(s.inherits);
    const srcNoz = new Set(base.c.map(c => PC.parseCompat(c).nozzle));
    for (const p of PC.printerList()) {
      let rs;
      try { rs = PC.convertPreset(s, p); } catch (e) { bad.push(s.name + '->' + p + ': ' + e.message); continue; }
      for (const x of ok(rs)) {
        count++;
        const tb = db.byName[s.kind].get(x.json.inherits);
        if (!tb) { bad.push('missing base ' + x.json.inherits); continue; }
        const eff = x.json.compatible_printers || tb.c.filter(c => PC.parseCompat(c).printer === p);
        if (!eff.length || eff.some(c => { const q = PC.parseCompat(c); return q.printer !== p || !srcNoz.has(q.nozzle); })) bad.push(x.json.name);
      }
    }
  }
  t(`brute force: ${count} copies, nozzles all safe`, bad.length === 0 && count > 100, bad);

  const files = [{ path: 'a.json', data: new TextEncoder().encode('{"x":1}') }];
  const back = await PC.readZip(await PC.writeZip(files).arrayBuffer());
  t('zip round trip', back.length === 1 && new TextDecoder().decode(back[0].data) === '{"x":1}');

  document.getElementById('r').textContent = log.join('\n');
})().catch(e => document.getElementById('r').textContent = 'ERROR ' + e.stack);
</script>
